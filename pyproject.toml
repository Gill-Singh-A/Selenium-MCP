[project]
name = "selenium-mcp"
version = "0.1.0"
description = "A Model Context Protocol server that exposes Selenium WebDriver so an LLM can fully operate a web browser."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.5.0",
    "selenium>=4.49.0",
]

[project.scripts]
selenium-mcp = "selenium_mcp.server:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["selenium_mcp"]
